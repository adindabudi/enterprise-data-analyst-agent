# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: enterprise-data-analyst
metadata:
  template: enterprise-data-analyst@0.1.0
requiredVersions:
  azd: ">=1.31.1"
infra:
  provider: bicep
  path: infra/bicep
  module: main
services:
  api:
    project: .
    host: containerapp
    language: python
    docker:
      path: apps/api/Dockerfile
      context: .
      remoteBuild: true
      buildArgs:
        - EDA_WORKER_IMAGE=${EDA_WORKER_IMAGE}
hooks:
  preprovision:
    shell: sh
    dir: .
    run: ./scripts/doctor.sh && ./scripts/doctor-documents.sh --phase prebuild && ./scripts/ensure-entra-app.sh && ./scripts/preflight-model.sh && ./scripts/configure-fabric-entra.sh bootstrap && ./scripts/run-fabric-provider-hook.sh preprovision
  postprovision:
    shell: sh
    dir: .
    run: uv run python scripts/sync-bicep-outputs.py && ./scripts/configure-fabric-entra.sh finalize && ./scripts/run-fabric-provider-hook.sh postprovision && ./scripts/build-worker-image.sh && ./scripts/build-sandbox-image.sh && ./scripts/deploy-sandbox-group.sh && ./scripts/configure-entra-federation.sh
  postdeploy:
    shell: sh
    dir: .
    run: ./scripts/doctor-documents.sh --phase postdeploy --output .artifacts/document-image-contract.json && ./scripts/publish-document-contract-job.sh && ./scripts/pin-application-images.sh && ./scripts/run-fabric-provider-hook.sh postdeploy && ./scripts/deploy-smoke.sh
