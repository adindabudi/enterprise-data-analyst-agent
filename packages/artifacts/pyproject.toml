[project]
name = "eda-artifacts"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "beautifulsoup4==4.15.0",
  "bleach==6.4.0",
  "defusedxml==0.7.1",
  "jsonschema==4.26.0",
  "lxml==6.1.1",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.10",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pypdf==6.14.2",
  "referencing==0.37.0",
  "reportlab==5.0.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_artifacts"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
