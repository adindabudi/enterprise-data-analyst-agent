[project]
name = "eda-runtime-state"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "azure-cosmos==4.16.2",
  "eda-contracts",
  "redis==8.0.1",
  "redis-entraid==1.2.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_runtime_state"]