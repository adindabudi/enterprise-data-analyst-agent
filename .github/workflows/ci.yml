name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: make bootstrap
      - name: Install verified secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/eda-gitleaks"
          mkdir -p "$scanner_dir"
          cd "$scanner_dir"
          release="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_linux_x64.tar.gz" --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - run: uv run python -m pytest scripts/tests/test_secret_scan.py scripts/tests/test_license_allowlist.py scripts/tests/test_python_sbom.py -q
      - run: ./scripts/scan-secrets.sh
      - run: npx playwright install --with-deps chromium
      - name: Configure document render tests
        run: node -e 'console.log("PUPPETEER_EXECUTABLE_PATH=" + require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: make check

  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: make integration
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --remove-orphans
