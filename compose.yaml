name: enterprise-data-analyst

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis:
    image: redis:8.0.1-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-health:
    image: python:3.12-alpine
    depends_on:
      redis:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class HealthHandler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200 if self.path == "/health" else 404)
                self.end_headers()

            def log_message(self, format, *args):
                pass

        HTTPServer(("0.0.0.0", 8079), HealthHandler).serve_forever()
    ports:
      - "18079:8079"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8079/health').status == 200",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    profiles: ["cosmos"]
    environment:
      PROTOCOL: http
    ports:
      - "1234:1234"
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --spider http://127.0.0.1:1234/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
