[project]
name = "eda-sandbox"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "duckdb==1.5.5",
  "eda-artifacts",
  "eda-contracts",
  "fastapi==0.139.2",
  "kaleido==1.3.0",
  "matplotlib==3.11.1",
  "numpy==2.5.1",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pandera==0.32.1",
  "pillow==12.3.0",
  "plotly==6.9.0",
  "psutil==7.2.2",
  "pyarrow==25.0.0",
  "python-multipart==0.0.32",
  "pypdf==6.14.2",
  "pdfplumber==0.11.10",
  "reportlab==5.0.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "seaborn==0.13.2",
  "statsmodels==0.14.6",
  "uvicorn==0.51.0",
  "xlsxwriter==3.2.9",
  "markitdown[pptx]==0.1.6",
  "defusedxml==0.7.1",
  "lxml==6.1.1",
]

[project.scripts]
eda-sandbox = "eda_sandbox.entrypoint:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_sandbox"]
